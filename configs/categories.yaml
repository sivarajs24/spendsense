# System Special Categories (not trained in supervised model, handled via application rules)
system_categories:
  - id: transfer
    name: "Transfer"
    description: "Internal transfers between own accounts, peer-to-peer personal transfers."
    keywords:
      - self transfer
      - transfer to
      - transfer from
      - p2p transfer
      - neft transfer

  - id: uncategorized
    name: "Uncategorized / Review Required"
    description: "Transactions with low prediction confidence or ambiguous descriptions."

