[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spendsense"
version = "0.1.0"
description = "Personal Expense Intelligence — Classical ML, active review queues, and UPI transaction intelligence."
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = {text = "MIT"}
authors = [
    {name = "SpendSense Team"}
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "mlflow>=2.11.0",
    "shap>=0.45.0",
    "duckdb>=0.10.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends pattern)
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

